name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-inputs:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select a version stable across reruns
        id: version
        shell: bash
        run: |
          timestamp=$(git show -s --format=%ct "$GITHUB_SHA")
          version=$(date -u -d "@$timestamp" '+%Y.%-m.%-d')
          echo "version=$version.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
      - name: Exercise the release gate
        shell: pwsh
        run: ./Build/VerifyReleasePackages.ps1

  windows-build:
    needs: release-inputs
    runs-on: windows-2025-vs2026
    timeout-minutes: 330
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\.vcpkg-binary-cache
      VCPKG_CACHE_KEY_PREFIX: vcpkg-windows-x64-30ef65cad98f08e7197c9a1656fbd871bcb72f2d
      TEDTOOLKIT_NATIVE_SCRATCH_ROOT: ${{ github.workspace }}\output
      CPPBINDINGS_PACKAGE_VERSION: ${{ needs.release-inputs.outputs.version }}
      CPPBINDINGS_WINDOWS_ISOLATION_REPORT: ${{ github.workspace }}\out\verification\ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup locked CMake
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --disable-pip-version-check --no-warn-script-location cmake==4.4.3
          $cmakeBin = python -c "import cmake; print(cmake.CMAKE_BIN_DIR)"
          $cmakeBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify source-built SMLib NuGet package
        shell: pwsh
        run: pwsh -NoProfile -File Build/VerifySmlibWindowsPackage.ps1 -ReportDirectory out/verification/smlib-ci

      - name: Checkout locked vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 30ef65cad98f08e7197c9a1656fbd871bcb72f2d
          path: .vcpkg

      - name: Restore vcpkg binary packages
        id: vcpkg-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ env.VCPKG_CACHE_KEY_PREFIX }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ env.VCPKG_CACHE_KEY_PREFIX }}-

      - name: Install locked native dependencies
        id: vcpkg-install
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Path $env:VCPKG_DEFAULT_BINARY_CACHE -Force | Out-Null
          $cacheBefore = @(
            Get-ChildItem -LiteralPath $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                '{0}|{1}' -f [IO.Path]::GetRelativePath(
                  $env:VCPKG_DEFAULT_BINARY_CACHE,
                  $_.FullName), $_.Length
              }
          ) -join "`n"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
              break
            }
            catch {
              if ($attempt -eq 3) { throw }
              Write-Warning "vcpkg bootstrap failed on attempt $attempt. Retrying the pinned download."
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          & "$env:VCPKG_ROOT\vcpkg.exe" install `
            opencascade:x64-windows `
            cgal:x64-windows `
            manifold:x64-windows `
            fcl:x64-windows `
            --clean-after-build
          $cacheAfter = @(
            Get-ChildItem -LiteralPath $env:VCPKG_DEFAULT_BINARY_CACHE -Recurse -File |
              Sort-Object FullName |
              ForEach-Object {
                '{0}|{1}' -f [IO.Path]::GetRelativePath(
                  $env:VCPKG_DEFAULT_BINARY_CACHE,
                  $_.FullName), $_.Length
              }
          ) -join "`n"
          $cacheUpdated = $cacheBefore -cne $cacheAfter
          "cache-updated=$($cacheUpdated.ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Save updated vcpkg binary packages
        if: steps.vcpkg-install.outputs.cache-updated == 'true'
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache-restore.outputs.cache-primary-key }}

      - name: Run Windows build pipeline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --version
          dotnet run --project Build/Build.csproj -c Release

      - name: Verify all generated Windows providers
        shell: pwsh
        run: pwsh -NoProfile -File Build/VerifyWindowsGenerationOutputs.ps1 -Configuration Release

      - name: Collect verified Windows packages
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $packages = Join-Path $env:RUNNER_TEMP 'win-x64'
          New-Item -ItemType Directory -Path $packages | Out-Null
          $verified = Join-Path $env:CPPBINDINGS_WINDOWS_ISOLATION_REPORT 'packages'
          Get-ChildItem -LiteralPath $verified -Filter '*.nupkg' -File | Copy-Item -Destination $packages
          Copy-Item 'out/verification/smlib-ci/feed/TedToolkit.CppBindings.Smlib.Windows.*.nupkg' -Destination $packages
          foreach ($project in @(./Build/ReleasePackages.ps1 -Mode Projects -Lane win-x64)) {
            $id = [IO.Path]::GetFileNameWithoutExtension($project)
            if (-not (Test-Path -LiteralPath (Join-Path $packages "$id.$env:CPPBINDINGS_PACKAGE_VERSION.nupkg"))) {
              if ($id.EndsWith('.Windows')) { throw "Verified Windows package is missing: $id" }
              dotnet pack $project -c Release -o $packages -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true
            }
          }
          ./Build/VerifyPlatformConsumers.ps1 -Lane win-x64 -PackageDirectory $packages -Version $env:CPPBINDINGS_PACKAGE_VERSION
          ./Build/ReleasePackages.ps1 -Mode Record -Lane win-x64 -Directory $packages -Commit $env:GITHUB_SHA -Version $env:CPPBINDINGS_PACKAGE_VERSION

      - name: Upload generated Windows sources
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-generated-sources
          path: |
            output/generated/csharp/
            output/providers/cgal/csharp/
            output/providers/manifold/csharp/
            output/providers/fcl/csharp/
            output/providers/smlib/csharp/
            output/windows-generation-summary.json
          retention-days: 2
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: win-x64
          path: ${{ runner.temp }}/win-x64/
          if-no-files-found: error
          retention-days: 14

  unix-build:
    needs: release-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux-x64
            runner: ubuntu-24.04
            triplet: x64-linux
          - lane: osx-arm64
            runner: macos-15
            triplet: arm64-osx
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    env:
      CPPBINDINGS_PACKAGE_VERSION: ${{ needs.release-inputs.outputs.version }}
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-binary-cache
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/Build/UnixTriplets
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CC: clang
      CXX: clang++
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up native build tools
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
        run: |
          if [[ "$LANE" == linux-x64 ]]; then
            sudo apt-get update
            sudo apt-get install -y autoconf autoconf-archive automake libtool ninja-build clang pkg-config patchelf binutils \
              libgl-dev libglu1-mesa-dev libx11-dev libxext-dev libxi-dev libxmu-dev libxrandr-dev libxrender-dev
          else
            xcode-select -p
            ninja --version
            HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_UPGRADE=1 \
              brew install autoconf autoconf-archive automake libtool
          fi
          python -m pip install --disable-pip-version-check cmake==4.4.3
          cmake --version
      - name: Check out locked vcpkg baseline
        uses: actions/checkout@v4
        with:
          repository: microsoft/vcpkg
          ref: 30ef65cad98f08e7197c9a1656fbd871bcb72f2d
          path: .vcpkg
          persist-credentials: false
      - uses: actions/cache@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.triplet }}-30ef65cad98f08e7197c9a1656fbd871bcb72f2d-${{ github.run_id }}
          restore-keys: vcpkg-${{ matrix.triplet }}-30ef65cad98f08e7197c9a1656fbd871bcb72f2d-
      - name: Install locked native dependencies
        shell: bash
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_ROOT/vcpkg" install "opencascade:$VCPKG_TRIPLET" "cgal:$VCPKG_TRIPLET" \
            "manifold:$VCPKG_TRIPLET" "fcl:$VCPKG_TRIPLET" --overlay-triplets=Build/UnixTriplets --clean-after-build
      - name: Pack native providers
        shell: pwsh
        env:
          LANE: ${{ matrix.lane }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          Copy-Item 'externals/TedToolkit/.editorconfig' .editorconfig
          $packages = Join-Path $env:RUNNER_TEMP $env:LANE
          foreach ($project in @(./Build/ReleasePackages.ps1 -Mode Projects -Lane $env:LANE)) {
            dotnet pack $project -c Release -o $packages -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true
          }
      - uses: actions/upload-artifact@v4
        with:
          name: packed-${{ matrix.lane }}
          path: ${{ runner.temp }}/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 14

  unix-verify:
    needs: [release-inputs, windows-build, unix-build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: linux-x64
            runner: ubuntu-24.04
          - lane: osx-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      CPPBINDINGS_PACKAGE_VERSION: ${{ needs.release-inputs.outputs.version }}
      LANE: ${{ matrix.lane }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install the Ubuntu graphics system libraries
        if: matrix.lane == 'linux-x64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglu1-mesa libglx0 libopengl0 libegl1 libx11-6 libxext6 libxi6 libxmu6 libxrandr2 libxrender1
      - uses: actions/download-artifact@v4
        with:
          name: packed-${{ matrix.lane }}
          path: ${{ runner.temp }}/${{ matrix.lane }}
      - uses: actions/download-artifact@v4
        with:
          name: win-x64
          path: ${{ runner.temp }}/win-x64
      - name: Restore and exercise the packaged bindings
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packages = Join-Path $env:RUNNER_TEMP $env:LANE
          $shared = Join-Path $env:RUNNER_TEMP 'win-x64'
          ./Build/VerifyPlatformConsumers.ps1 -Lane $env:LANE -PackageDirectory $packages -SharedPackageDirectory $shared -Version $env:CPPBINDINGS_PACKAGE_VERSION
          ./Build/ReleasePackages.ps1 -Mode Record -Lane $env:LANE -Directory $packages -Commit $env:GITHUB_SHA -Version $env:CPPBINDINGS_PACKAGE_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lane }}
          path: ${{ runner.temp }}/${{ matrix.lane }}/
          if-no-files-found: error
          retention-days: 14

  release-check:
    needs: [release-inputs, windows-build, unix-verify]
    runs-on: ubuntu-24.04
    env:
      CPPBINDINGS_PACKAGE_VERSION: ${{ needs.release-inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: '{win-x64,linux-x64,osx-arm64}'
          path: ${{ runner.temp }}/release-packages
      - name: Validate the complete release inventory
        shell: pwsh
        run: |
          ./Build/ReleasePackages.ps1 -Mode Validate -Directory (Join-Path $env:RUNNER_TEMP 'release-packages') -Commit $env:GITHUB_SHA -Version $env:CPPBINDINGS_PACKAGE_VERSION

  prepare-release:
    needs: release-check
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: cppbindings-release-pr
    steps:
      - name: Keep a draft release PR open
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verified_head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/development" --jq '.object.sha')
          if [[ "$verified_head" != "$GITHUB_SHA" ]]; then
            exit 0
          fi
          open_pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head development --base main \
            --json number --jq '.[0].number // empty')
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...development" --jq '.ahead_by')
          if [[ -z "$open_pr" && "$ahead" -gt 0 ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --draft --head development --base main \
              --title "🔖 Release" --body "Verified Windows x64, Linux x64, and macOS Arm64 packages from $GITHUB_SHA."
          fi

  publish:
    needs: [release-inputs, release-check]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CPPBINDINGS_PACKAGE_VERSION: ${{ needs.release-inputs.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: '{win-x64,linux-x64,osx-arm64}'
          path: ${{ runner.temp }}/release-packages
      - name: Publish the verified packages
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ secrets.NUGET__APIKEY }}
          NUGET_SOURCE: ${{ vars.NUGET__SOURCE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $version = $env:CPPBINDINGS_PACKAGE_VERSION
          $tag = @(git ls-remote --tags origin "refs/tags/$version" "refs/tags/$version^{}")
          if ($tag.Count -gt 0 -and ($tag[-1] -split '\s+')[0] -cne $env:GITHUB_SHA) {
            throw "Release tag $version belongs to another commit."
          }
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $releaseUrl = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/releases/tags/$version"
          $existing = $null
          try {
            $existing = Invoke-RestMethod -Uri $releaseUrl -Headers $headers -MaximumRedirection 0
          }
          catch {
            if ($_.Exception -isnot [Microsoft.PowerShell.Commands.HttpResponseException] -or
                [int]$_.Exception.Response.StatusCode -ne 404) { throw }
          }
          ./Build/ReleasePackages.ps1 -Mode Publish -Directory (Join-Path $env:RUNNER_TEMP 'release-packages') -Commit $env:GITHUB_SHA -Version $version
          if (-not $existing) {
            $tagArgs = if ($tag.Count -gt 0) { @('--verify-tag') } else { @() }
            gh release create $version --target $env:GITHUB_SHA --title $version --generate-notes @tagArgs
          }
